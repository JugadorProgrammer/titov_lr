name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -B -m unittest discover -p 'test_*.py'
      - run: python -B -m pydoc -w operations
      - uses: actions/upload-artifact@v4
        with:
          name: python-api-docs
          path: operations.html
